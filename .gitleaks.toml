# Gitleaks config: the default ruleset plus our own Vault token rule.
title = "ecommerce gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "vault-service-token"
description = "HashiCorp Vault service token"
regex = '''hvs\.[A-Za-z0-9_-]{24,}'''
keywords = ["hvs."]

[allowlist]
description = "Known safe paths"
paths = [
  '''test/fixtures/''',
  '''(.*?)(png|jpg|gif|svg|ico|woff2?)$''',
]
