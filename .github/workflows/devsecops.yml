# DevSecOps pipeline for the e-commerce microservices.
#
# The order matters. Cheap, fast checks run first so a leaked key or a
# failing quality gate stops the run before we spend 20 minutes building
# 24 images:
#
#   1. secrets  - Gitleaks over the full git history
#   2. sast     - SonarQube scan, blocks on the quality gate
#   3. sca      - OWASP Dependency-Check, fails on CVSS >= 7
#   4. iac/fs   - Trivy filesystem scan (vulns, secrets, Dockerfile + k8s + Helm misconfig)
#   5. build    - build each image, Trivy image scan, SBOM, then push + cosign sign
#   6. dev      - verify signatures, helm deploy, smoke test
#   7. dast     - OWASP ZAP baseline against dev
#   8. staging  - same deploy, behind a required reviewer (GitHub Environment)
#   9. prod     - same deploy, behind a different required reviewer
#
# No long-lived cloud keys. AWS access is GitHub OIDC -> IAM role (short-lived
# STS credentials, trust policy locked to this repo + main / an Environment).
# Only two GitHub secrets exist:
#   SONAR_TOKEN   - SonarCloud analysis token (scan jobs)
#   NVD_API_KEY   - optional, speeds up Dependency-Check NVD downloads
# plus AWS_ROLE_ARN (not really secret, kept as a secret so it is masked).
# Repository variables: AWS_REGION, ECR_REPO_PREFIX, SONAR_ORGANIZATION,
# SONAR_PROJECT_KEY, ENFORCE_SECURITY_GATES, DEPLOY_ENABLED.
#
# Rollout mode: Gitleaks always blocks. Sonar, Dependency-Check and Trivy
# report to the Security tab but only block once ENFORCE_SECURITY_GATES=true.
#
# Every third-party action is pinned to a full commit SHA. Tags can be moved;
# that is exactly how the March 2026 trivy-action compromise worked. Trivy and
# Gitleaks are installed as release binaries with checksum verification
# (ci/install-tool.sh) instead of through wrapper actions.
name: DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

# Deny everything at the top. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: devsecops-${{ github.ref }}
  # Cancel stale PR runs, but never cancel a main run halfway through a push or deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: 0.76.2
  GITLEAKS_VERSION: 8.30.1
  DEPCHECK_IMAGE: owasp/dependency-check:12.1.0   # pin to @sha256 digest in a real rollout

jobs:
  # ---------------------------------------------------------------------------
  # 1. Secrets scanning
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history, a secret deleted last month is still leaked
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: bash ci/install-tool.sh gitleaks "$GITLEAKS_VERSION"

      - name: Scan git history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # 2. SAST - SonarQube with a blocking quality gate
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # Sonar PR decoration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # Sonar needs blame data for "new code"
          persist-credentials: false

      # Fork PRs get no secrets; skip instead of failing.
      - name: SonarCloud scan
        if: github.event.pull_request.head.repo.fork != true
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16  # v8.5.1
        continue-on-error: ${{ vars.ENFORCE_SECURITY_GATES != 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # wait=true makes the step fail if the quality gate fails.
          # Without it Sonar is just a dashboard nobody looks at.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ---------------------------------------------------------------------------
  # 3. SCA - OWASP Dependency-Check
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The NVD database is ~2 GB. Without a cache every run spends 10+ minutes
      # downloading it and hits NVD rate limits.
      - name: Cache NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: depcheck-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: depcheck-nvd-${{ runner.os }}-

      - name: Run Dependency-Check
        continue-on-error: ${{ vars.ENFORCE_SECURITY_GATES != 'true' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/.dependency-check/data reports
          # The key is optional: without it the first run is slow but works.
          NVD_ARGS=()
          [ -n "$NVD_API_KEY" ] && NVD_ARGS=(--nvdApiKey "$NVD_API_KEY")
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src:ro \
            -v ~/.dependency-check/data:/usr/share/dependency-check/data \
            -v "$PWD/reports":/report \
            "$DEPCHECK_IMAGE" \
              --scan /src/src \
              --project "ecommerce" \
              "${NVD_ARGS[@]}" \
              --suppression /src/security/dependency-check-suppressions.xml \
              --exclude "**/node_modules/**" \
              --exclude "**/test/**" \
              --format HTML --format SARIF --format JSON \
              --failOnCVSS 7 \
              --out /report

      - name: Upload SARIF
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. Trivy filesystem + IaC scan
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Trivy fs + IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (checksum verified)
        run: bash ci/install-tool.sh trivy "$TRIVY_VERSION"

      # One pass for the report (everything, never fails) ...
      - name: Full report to SARIF
        run: |
          trivy fs . --config security/trivy.yaml \
            --scanners vuln,secret,misconfig \
            --format sarif --output trivy-fs.sarif \
            --exit-code 0

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: always()
        continue-on-error: true   # Security tab needs GHAS on private repos; never block on the upload
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ... and one pass for the gate (only what we agreed should block).
      - name: Gate on HIGH/CRITICAL
        continue-on-error: ${{ vars.ENFORCE_SECURITY_GATES != 'true' }}
        run: |
          trivy fs . --config security/trivy.yaml \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

  # ---------------------------------------------------------------------------
  # 5. Build, scan, SBOM, push, sign
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service.name }}
    needs: [secrets-scan, sast, sca, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # AWS role + cosign keyless both use the OIDC token
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service:
          - { name: accounting,      dockerfile: src/accounting/Dockerfile,      build_args: "" }
          - { name: ad,              dockerfile: src/ad/Dockerfile,              build_args: "OTEL_JAVA_AGENT_VERSION" }
          - { name: agent,           dockerfile: src/agent/Dockerfile,           build_args: "" }
          - { name: cart,            dockerfile: src/cart/src/Dockerfile,        build_args: "" }
          - { name: chatbot,         dockerfile: src/chatbot/Dockerfile,         build_args: "" }
          - { name: checkout,        dockerfile: src/checkout/Dockerfile,        build_args: "" }
          - { name: currency,        dockerfile: src/currency/Dockerfile,        build_args: "OPENTELEMETRY_CPP_VERSION" }
          - { name: email,           dockerfile: src/email/Dockerfile,           build_args: "" }
          - { name: flagd-ui,        dockerfile: src/flagd-ui/Dockerfile,        build_args: "" }
          - { name: fraud-detection, dockerfile: src/fraud-detection/Dockerfile, build_args: "OTEL_JAVA_AGENT_VERSION" }
          - { name: frontend,        dockerfile: src/frontend/Dockerfile,        build_args: "" }
          - { name: frontend-proxy,  dockerfile: src/frontend-proxy/Dockerfile,  build_args: "" }
          - { name: image-provider,  dockerfile: src/image-provider/Dockerfile,  build_args: "" }
          - { name: kafka,           dockerfile: src/kafka/Dockerfile,           build_args: "OTEL_JAVA_AGENT_VERSION" }
          - { name: load-generator,  dockerfile: src/load-generator/Dockerfile,  build_args: "" }
          - { name: mcp,             dockerfile: src/mcp/Dockerfile,             build_args: "" }
          - { name: opamp-server,    dockerfile: src/opamp-server/Dockerfile,    build_args: "OPAMP_GO_REF" }
          - { name: opensearch,      dockerfile: src/opensearch/Dockerfile,      build_args: "" }
          - { name: payment,         dockerfile: src/payment/Dockerfile,         build_args: "" }
          - { name: product-catalog, dockerfile: src/product-catalog/Dockerfile, build_args: "" }
          - { name: quote,           dockerfile: src/quote/Dockerfile,           build_args: "" }
          - { name: recommendation,  dockerfile: src/recommendation/Dockerfile,  build_args: "" }
          - { name: shipping,        dockerfile: src/shipping/Dockerfile,        build_args: "" }
          - { name: telemetry-docs,  dockerfile: src/telemetry-docs/Dockerfile,  build_args: "" }
    env:
      SERVICE: ${{ matrix.service.name }}
      ECR_REPO_PREFIX: ${{ vars.ECR_REPO_PREFIX || 'ecomerce' }}
      # Only main pushes images. PRs build and scan, nothing leaves the runner.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load build-arg pins from .env
        run: grep -E '^(OTEL_JAVA_AGENT_VERSION|OPENTELEMETRY_CPP_VERSION|OPAMP_GO_REF)=' .env >> "$GITHUB_ENV"

      - name: Resolve build args
        id: args
        env:
          ARG_NAMES: ${{ matrix.service.build_args }}
        run: |
          {
            echo "list<<EOF"
            IFS=',' read -ra NAMES <<< "$ARG_NAMES"
            for n in "${NAMES[@]}"; do [ -n "$n" ] && echo "${n}=${!n}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Build amd64 only, load it into the local daemon, and scan it BEFORE
      # anything is pushed. A vulnerable image should never reach the registry.
      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: ${{ steps.args.outputs.list }}
          tags: scan/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Install Trivy (checksum verified)
        run: bash ci/install-tool.sh trivy "$TRIVY_VERSION"

      - name: Trivy image scan (report)
        run: |
          trivy image "scan/${SERVICE}:${GITHUB_SHA}" \
            --config security/trivy.yaml \
            --format sarif --output "trivy-image-${SERVICE}.sarif" \
            --exit-code 0

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: always()
        continue-on-error: true   # Security tab needs GHAS on private repos; never block on the upload
        with:
          sarif_file: trivy-image-${{ matrix.service.name }}.sarif
          category: trivy-image-${{ matrix.service.name }}

      - name: Trivy image scan (gate)
        continue-on-error: ${{ vars.ENFORCE_SECURITY_GATES != 'true' }}
        run: |
          trivy image "scan/${SERVICE}:${GITHUB_SHA}" \
            --config security/trivy.yaml \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Generate SBOM (CycloneDX)
        run: trivy image "scan/${SERVICE}:${GITHUB_SHA}" --format cyclonedx --output "sbom-${SERVICE}.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.cdx.json
          retention-days: 90

      # ---- Everything below only runs on main ----

      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-build-${{ matrix.service.name }}-${{ github.run_id }}

      - name: Log in to ECR
        if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Ensure ECR repo (immutable tags, KMS, scan on push)
        if: env.PUBLISH == 'true'
        run: |
          REPO="${ECR_REPO_PREFIX}/${SERVICE}"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPO" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=KMS
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${REPO}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
        if: env.PUBLISH == 'true'

      # Same Dockerfile, same cache, now multi-arch and pushed. Tag is the git
      # SHA only; no "latest". Immutable tags mean a tag always means one image.
      - name: Build and push (multi-arch)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          build-args: ${{ steps.args.outputs.list }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        if: env.PUBLISH == 'true'

      # Keyless signing: cosign swaps the job's OIDC token for a short-lived
      # Fulcio cert. No signing key to store or rotate. We sign the DIGEST,
      # never a tag.
      - name: Sign image and attach SBOM attestation
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx \
            --predicate "sbom-${SERVICE}.cdx.json" \
            "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # 6-9. Promote: dev -> DAST -> staging -> prod
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy dev
    needs: build
    # Turn deploys on once the EKS cluster exists: repo variable DEPLOY_ENABLED=true.
    # Until then the pipeline stops after build, scan, sign and push.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: dev
      image_tag: ${{ github.sha }}

  dast-dev:
    name: DAST (OWASP ZAP baseline)
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Passive scan only. A full active scan belongs in a nightly job against
      # an isolated env, not in every merge.
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ needs.deploy-dev.outputs.app_url }}
          rules_file_name: security/zap-rules.tsv
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report-dev

  deploy-staging:
    name: Deploy staging
    needs: [deploy-dev, dast-dev]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      image_tag: ${{ github.sha }}

  deploy-prod:
    name: Deploy prod
    needs: deploy-staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: prod
      image_tag: ${{ github.sha }}
