name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    outputs:
      app_url:
        description: Public URL of the deployed frontend
        value: ${{ jobs.deploy.outputs.app_url }}

permissions: {}

env:
  RELEASE: ecommerce
  NAMESPACE: ecommerce-${{ inputs.environment }}

jobs:
  deploy:
    name: helm upgrade (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      app_url: ${{ steps.url.outputs.app_url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Environment-level variables override repo-level ones of the same name.
      - name: Load environment settings
        env:
          REGION: ${{ vars.AWS_REGION }}
          CLUSTER: ${{ vars.EKS_CLUSTER }}
          PREFIX: ${{ vars.ECR_REPO_PREFIX || 'ecomerce' }}
        run: |
          [ -n "$REGION" ] && [ -n "$CLUSTER" ] || { echo "::error::Set AWS_REGION and EKS_CLUSTER on the ${{ inputs.environment }} environment"; exit 1; }
          { echo "AWS_REGION=$REGION"; echo "EKS_CLUSTER=$CLUSTER"; echo "ECR_REPO_PREFIX=$PREFIX"; } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v4.3.2

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Export registry
        run: echo "ECR_REGISTRY=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_ENV"

      # Last line of defence before anything runs in the cluster: every image
      # must carry a signature made by THIS repo's DevSecOps workflow on main.
      # An image pushed by hand, or from a fork, fails here.
      - name: Verify image signatures
        env:
          TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops.yml@refs/heads/main
        run: bash ci/verify-images.sh

      - name: Connect to EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Lint and render the chart
        run: |
          helm lint charts/ecommerce -f charts/ecommerce/values-${{ inputs.environment }}.yaml
          helm template "$RELEASE" charts/ecommerce \
            -f charts/ecommerce/values-${{ inputs.environment }}.yaml \
            --set global.image.registry="${ECR_REGISTRY}/${ECR_REPO_PREFIX}" \
            --set global.image.tag="${{ inputs.image_tag }}" > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"

      # --rollback-on-failure (Helm 4, was --atomic): if pods don't come up
      # healthy inside the timeout, Helm rolls back to the last good release.
      - name: helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" charts/ecommerce \
            --namespace "$NAMESPACE" --create-namespace \
            -f charts/ecommerce/values-${{ inputs.environment }}.yaml \
            --set global.image.registry="${ECR_REGISTRY}/${ECR_REPO_PREFIX}" \
            --set global.image.tag="${{ inputs.image_tag }}" \
            --rollback-on-failure --wait --timeout 10m \
            --history-max 10

      - name: Find the app URL
        id: url
        run: |
          HOST=$(kubectl -n "$NAMESPACE" get ingress "$RELEASE-frontend" -o jsonpath='{.spec.rules[0].host}')
          echo "app_url=https://${HOST}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.url.outputs.app_url }}
        run: bash ci/smoke-test.sh "$APP_URL"
