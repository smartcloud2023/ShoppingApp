# Extra secret patterns on top of Trivy's built-in rules.
rules:
  - id: vault-token
    category: HashiCorp
    title: Vault service token
    severity: CRITICAL
    regex: 'hvs\.[A-Za-z0-9_-]{24,}'
  - id: vault-batch-token
    category: HashiCorp
    title: Vault batch token
    severity: HIGH
    regex: 'hvb\.[A-Za-z0-9_-]{24,}'

allow-rules:
  - id: test-fixtures
    description: Fake keys used in unit tests
    path: 'test/fixtures/.*'
