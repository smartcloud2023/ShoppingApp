{{- if .Values.ingress.enabled }}
{{- $i := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  annotations:
    {{- if $i.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $i.tls.clusterIssuer }}
    {{- end }}
    # Security headers (HSTS, nosniff, X-Frame-Options) are set once in the
    # ingress controller ConfigMap (add-headers), NOT with snippet annotations.
    # Snippets are off by default since CVE-2025-1974 ("IngressNightmare").
    {{- range $k, $v := $i.annotations }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ $i.className }}
  {{- if $i.tls.enabled }}
  tls:
    - hosts: [{{ $i.host | quote }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ $i.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $i.service }}
                port:
                  number: {{ $i.port }}
{{- end }}
