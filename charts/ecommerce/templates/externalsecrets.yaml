{{- /*
  Secrets come from Vault, never from git. External Secrets Operator reads
  secret/ecommerce/app/<env>/<path> with Vault's Kubernetes auth and writes a
  normal k8s Secret that the pod loads with envFrom.

  values:  secrets: { DB_PASSWORD: postgres/password }
  vault:   secret/ecommerce/app/<env>/postgres  key=password
*/ -}}
{{- if .Values.global.externalSecrets.enabled }}
{{- $es := .Values.global.externalSecrets }}
{{- $env := required "environment must be set (values-<env>.yaml)" .Values.environment }}
{{- range $name, $svc := .Values.services }}
{{- if and (or (not (hasKey $svc "enabled")) $svc.enabled) $svc.secrets }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ecommerce.fullname" $ctx }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.secretStore }}
  target:
    name: {{ include "ecommerce.fullname" $ctx }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $envVar, $ref := $svc.secrets }}
    {{- $parts := splitList "/" $ref }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ printf "ecommerce/app/%s/%s" $env (first $parts) }}
        property: {{ last $parts }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
