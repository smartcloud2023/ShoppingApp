{{- /*
  Zero trust inside the namespace:
    1. default-deny all ingress and egress
    2. allow DNS for everyone
    3. allow OTLP to the collector and scraping from monitoring
    4. per service: allow egress only to the services listed in talksTo,
       and ingress only from services that list it in their talksTo
  So if "email" gets popped, it cannot reach "payment" or the database.
*/ -}}
{{- if .Values.global.networkPolicy.enabled }}
{{- $np := .Values.global.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns-otel
spec:
  podSelector: {}
  policyTypes: [Egress, Ingress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
{{- range $name, $svc := .Values.services }}
{{- if or (not (hasKey $svc "enabled")) $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecommerce.fullname" $ctx }}
spec:
  podSelector:
    matchLabels:
      {{- include "ecommerce.selector" $ctx | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if $svc.ingress }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
    {{- end }}
    {{- range $caller, $c := $.Values.services }}
    {{- if and (or (not (hasKey $c "enabled")) $c.enabled) (has $name (default (list) $c.talksTo)) }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $caller }}
    {{- end }}
    {{- end }}
  egress:
    {{- range $target := default (list) $svc.talksTo }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $target }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
