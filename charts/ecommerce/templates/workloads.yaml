{{- /*
  One loop renders everything a service needs: ServiceAccount, Deployment,
  Service, and optionally HPA and PDB. Adding a microservice is a values
  change, not a template change.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if or (not (hasKey $svc "enabled")) $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $fullname := include "ecommerce.fullname" $ctx }}
{{- $hpa := merge (default (dict) $svc.hpa) $.Values.defaults.hpa }}
{{- $pdb := merge (default (dict) $svc.pdb) $.Values.defaults.pdb }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
# No service needs to talk to the Kubernetes API, so don't hand them a token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  {{- if not $hpa.enabled }}
  replicas: {{ default $.Values.defaults.replicas $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ecommerce.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecommerce.labels" $ctx | nindent 8 }}
      annotations:
        {{- if $svc.secrets }}
        # Roll the pods when the synced secret changes.
        checksum/secrets: {{ toJson $svc.secrets | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml (default $.Values.global.podSecurityContext $svc.podSecurityContext) | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ecommerce.selector" $ctx | nindent 14 }}
      containers:
        - name: {{ $name }}
          image: {{ include "ecommerce.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml (default $.Values.global.containerSecurityContext $svc.containerSecurityContext) | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          ports:
            - name: app
              containerPort: {{ $svc.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: app }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: app }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s%s" $.Values.global.otel.serviceNamePrefix $name | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.global.otel.endpoint | quote }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if and $svc.secrets $.Values.global.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}
          {{- end }}
          resources:
            {{- include "ecommerce.resources" $ctx | nindent 12 }}
          {{- if $svc.tmp }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if $svc.tmp }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      {{- end }}
{{- if gt (int $svc.port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  # Short name on purpose: other services call each other by this name.
  name: {{ $name }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selector" $ctx | nindent 4 }}
  ports:
    - name: app
      port: {{ $svc.port }}
      targetPort: app
{{- end }}
{{- if $hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPU }}
{{- end }}
{{- if $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ecommerce.selector" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
