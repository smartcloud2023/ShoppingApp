# SonarQube project settings. The token and server URL are NOT here,
# the pipeline reads them from Vault (secret/ecommerce/scan).
sonar.projectKey=ecommerce-final-project
sonar.projectName=E-commerce microservices

sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Generated code, vendored deps and build output are noise, not our code.
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/build/**,\
  **/dist/**,\
  **/target/**,\
  **/*_pb2*.py,\
  **/*.pb.go,\
  **/genproto/**,\
  src/**/protos/**

sonar.test.inclusions=test/**/*.py,**/*_test.go,**/*.test.ts,**/*Test.java

# Coverage reports, if the language builds produce them.
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

# The quality gate itself is configured on the server ("Sonar way" plus:
# no new Blocker/Critical issues, no new hotspots unreviewed,
# coverage on new code >= 60%, duplication on new code <= 3%).
